name: Reusable App Build

# Passthrough to daemonless/dbuild — migrate callers to
# daemonless/dbuild/.github/workflows/daemonless-build.yaml@main

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Image name (e.g., radarr, sonarr)'
        required: true
        type: string
      variant:
        description: 'Variant to build (blank=all)'
        required: false
        type: string
        default: ''

jobs:
  build:
    uses: daemonless/dbuild/.github/workflows/daemonless-build.yaml@main
    with:
      image_name: ${{ inputs.image_name }}
      variant: ${{ inputs.variant }}
    secrets: inherit
