name: Reusable App Build

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Image name (e.g., radarr, sonarr)'
        required: true
        type: string
      image_tag:
        description: 'Override tag (skips auto-detection)'
        required: false
        type: string
        default: ''
      build_args:
        description: 'Build args (e.g., PG_VERSION=14)'
        required: false
        type: string
        default: ''
      extra_tags:
        description: 'Extra tags (e.g., latest)'
        required: false
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  CIT_VERSION: "0.3.9"
  COMPOSE_PACKAGES: "py311-podman-compose"

jobs:
  # Detect which Containerfiles exist and build dynamic matrix
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      compose_only: ${{ steps.set-matrix.outputs.compose_only }}
      architectures: ${{ steps.set-matrix.outputs.architectures }}
      manifest_tags: ${{ steps.set-matrix.outputs.manifest_tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@master

      - name: Detect build matrix
        id: set-matrix
        run: |
          CONFIG_FILE=".daemonless/config.yaml"

          # Check for config.yaml with build.variants
          if [ -f "$CONFIG_FILE" ] && yq -e '.build.variants' "$CONFIG_FILE" >/dev/null 2>&1; then
            echo "Using build.variants from config.yaml"

            # Get auto_version and type
            auto_version=$(yq -r '.build.auto_version // false' "$CONFIG_FILE")
            img_type=$(yq -r '.type // "app"' "$CONFIG_FILE")

            # Get architectures (default to amd64 only)
            architectures=$(yq -r '.build.architectures // ["amd64"] | join(" ")' "$CONFIG_FILE")
            echo "Architectures: $architectures"

            # Build matrix from variants x architectures
            entries=""
            variant_count=$(yq '.build.variants | length' "$CONFIG_FILE")

            for i in $(seq 0 $((variant_count - 1))); do
              tag=$(yq -r ".build.variants[$i].tag" "$CONFIG_FILE")

              # Convert args object to space-separated KEY=VALUE string
              build_args=$(yq -r ".build.variants[$i].args // {} | to_entries | map(.key + \"=\" + .value) | join(\" \")" "$CONFIG_FILE")

              # Convert aliases array to space-separated string
              aliases=$(yq -r ".build.variants[$i].aliases // [] | join(\" \")" "$CONFIG_FILE")

              # Get containerfile (default to Containerfile)
              containerfile=$(yq -r ".build.variants[$i].containerfile // \"Containerfile\"" "$CONFIG_FILE")

              # Create entry for each architecture
              for arch in $architectures; do
                # Map arch to vmactions settings
                if [ "$arch" = "amd64" ]; then
                  arch_suffix=""
                  vm_arch=""
                  vm_sync="rsync"
                elif [ "$arch" = "aarch64" ]; then
                  arch_suffix="-aarch64"
                  vm_arch="aarch64"
                  vm_sync="rsync"
                elif [ "$arch" = "riscv64" ]; then
                  arch_suffix="-riscv64"
                  vm_arch="riscv64"
                  vm_sync="scp"
                fi
                entries+="{\"tag\":\"${tag}\",\"build_args\":\"${build_args}\",\"aliases\":\"${aliases}\",\"auto_version\":${auto_version},\"type\":\"${img_type}\",\"containerfile\":\"${containerfile}\",\"arch\":\"${arch}\",\"arch_suffix\":\"${arch_suffix}\",\"vm_arch\":\"${vm_arch}\",\"vm_sync\":\"${vm_sync}\"},"
              done
            done

            entries="${entries%,}"
            matrix="{\"include\":[${entries}]}"
            echo "Config matrix: $matrix"
            echo "matrix=$matrix" >> $GITHUB_OUTPUT
            echo "compose_only=false" >> $GITHUB_OUTPUT

            # Output architectures for manifest job
            arch_json=$(yq -r '.build.architectures // ["amd64"] | @json' "$CONFIG_FILE")
            echo "architectures=$arch_json" >> $GITHUB_OUTPUT

            # Build manifest tags list (tag + aliases for each variant)
            manifest_tags=""
            for i in $(seq 0 $((variant_count - 1))); do
              tag=$(yq -r ".build.variants[$i].tag" "$CONFIG_FILE")
              manifest_tags="$manifest_tags $tag"
              aliases=$(yq -r ".build.variants[$i].aliases // [] | .[]" "$CONFIG_FILE")
              for a in $aliases; do
                manifest_tags="$manifest_tags $a"
              done
            done
            echo "manifest_tags=$manifest_tags" >> $GITHUB_OUTPUT
            exit 0
          fi

          # If image_tag is provided, skip auto-detection (manual mode)
          if [ -n "${{ inputs.image_tag }}" ]; then
            tag="${{ inputs.image_tag }}"

            # Select containerfile based on tag name
            if [[ "$tag" == "pkg" || "$tag" == "pkg-latest" || "$tag" == *"-pkg" || "$tag" == *"-pkg-latest" ]]; then
              cf="Containerfile.pkg"
            else
              cf="Containerfile"
            fi

            # Fall back if preferred file doesn't exist
            if [ ! -f "$cf" ]; then
              if [ -f "Containerfile" ]; then
                cf="Containerfile"
              elif [ -f "Containerfile.pkg" ]; then
                cf="Containerfile.pkg"
              else
                echo "ERROR: No Containerfile or Containerfile.pkg found"
                exit 1
              fi
            fi

            # Determine version_suffix based on final containerfile and tag
            if [[ "$tag" == "pkg-latest" || "$tag" == *"-pkg-latest" ]]; then
              vs="-pkg-latest"
            elif [ "$cf" = "Containerfile.pkg" ]; then
              vs="-pkg"
            else
              vs=""
            fi
            matrix="{\"include\":[{\"containerfile\":\"${cf}\",\"tag\":\"${tag}\",\"base_version\":\"\",\"version_suffix\":\"${vs}\",\"push_latest\":\"\",\"auto_version\":false,\"type\":\"app\",\"arch\":\"amd64\",\"arch_suffix\":\"\",\"vm_arch\":\"\",\"vm_sync\":\"rsync\"}]}"
            echo "Manual mode: $matrix"
            echo "matrix=$matrix" >> $GITHUB_OUTPUT
            echo "compose_only=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Build JSON matrix based on existing Containerfiles
          entries=""
          has_source="false"

          if [ -f "Containerfile" ]; then
            # Source build from upstream binaries (latest tag)
            has_source="true"
            entries+='{"containerfile":"Containerfile","tag":"latest","base_version":"","version_suffix":"","push_latest":"","auto_version":false,"type":"app","arch":"amd64","arch_suffix":"","vm_arch":"","vm_sync":"rsync"},'
          fi

          if [ -f "Containerfile.pkg" ]; then
            entries+='{"containerfile":"Containerfile.pkg","tag":"pkg","base_version":"15-quarterly","version_suffix":"-pkg","push_latest":"","auto_version":false,"type":"app","arch":"amd64","arch_suffix":"","vm_arch":"","vm_sync":"rsync"},'
            # If no source build, pkg-latest should also be tagged as "latest"
            if [ "$has_source" = "false" ]; then
              entries+='{"containerfile":"Containerfile.pkg","tag":"pkg-latest","base_version":"15-latest","version_suffix":"-pkg-latest","push_latest":"--alias latest","auto_version":false,"type":"app","arch":"amd64","arch_suffix":"","vm_arch":"","vm_sync":"rsync"},'
            else
              entries+='{"containerfile":"Containerfile.pkg","tag":"pkg-latest","base_version":"15-latest","version_suffix":"-pkg-latest","push_latest":"","auto_version":false,"type":"app","arch":"amd64","arch_suffix":"","vm_arch":"","vm_sync":"rsync"},'
            fi
          fi

          # Remove trailing comma and wrap in matrix format
          entries="${entries%,}"
          matrix="{\"include\":[${entries}]}"

          # Check for compose-only mode (no Containerfiles but has compose.yml)
          if [ -z "$entries" ] && { [ -f ".daemonless/compose.yml" ] || [ -f ".daemonless/compose.yaml" ]; }; then
            echo "Compose-only mode detected"
            echo "compose_only=true" >> $GITHUB_OUTPUT
          else
            echo "compose_only=false" >> $GITHUB_OUTPUT
          fi

          echo "Detected matrix: $matrix"
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build:
    needs: detect
    if: ${{ needs.detect.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare VM data directory
        run: sudo mkdir -p /mnt/freebsd-vm && sudo chmod 777 /mnt/freebsd-vm

      - name: Build in FreeBSD VM (${{ matrix.tag }}${{ matrix.arch_suffix }})
        uses: vmactions/freebsd-vm@v1.3.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          release: "15.0"
          arch: ${{ matrix.vm_arch }}
          sync: ${{ matrix.vm_sync }}
          usesh: true
          copyback: true
          data-dir: /mnt/freebsd-vm
          envs: "GITHUB_TOKEN GITHUB_ACTOR DOCKERHUB_USERNAME DOCKERHUB_TOKEN"
          prepare: |
            set -e
            # Create 4GB swap for heavy builds
            dd if=/dev/zero of=/swapfile bs=1m count=4096
            chmod 0600 /swapfile
            mdconfig -a -t vnode -f /swapfile -u 0
            swapon /dev/md0

            # Use latest repo for CI tools (quarterly often has sync issues)
            mkdir -p /etc/pkg
            echo 'FreeBSD: { url: "http://pkg.FreeBSD.org/${ABI}/latest" }' > /etc/pkg/FreeBSD.conf
            pkg update -f
            pkg install -y podman jq skopeo buildah trivy

            # Install patched ocijail for .NET apps (mlock support)
            fetch -qo /tmp/ocijail.pkg "https://github.com/daemonless/freebsd-ports/releases/download/v0.4.0-patched/ocijail-0.4.0_2-${{ matrix.arch }}.pkg"
            pkg install -fy /tmp/ocijail.pkg

            rm -rf /var/db/containers /var/lib/containers 2>/dev/null || true
            kldload pf
            sysctl net.inet.ip.forwarding=1
            sysctl kern.ipc.shm_allow_removed=1
          run: |
            set -e
            # Download shared scripts (pinned to version)
            mkdir -p scripts
            fetch -qo scripts/build.sh \
              "https://raw.githubusercontent.com/daemonless/daemonless/build-v1.9.0/scripts/build.sh"
            fetch -qo scripts/generate-sbom.sh \
              "https://raw.githubusercontent.com/daemonless/daemonless/build-v1.9.0/scripts/generate-sbom.sh"
            chmod +x scripts/build.sh scripts/generate-sbom.sh

            # Build args from matrix (config.yaml) or inputs
            BUILD_ARGS=""
            if [ -n "${{ matrix.build_args }}" ]; then
              for arg in ${{ matrix.build_args }}; do
                BUILD_ARGS="$BUILD_ARGS --build-arg $arg"
              done
            fi
            if [ -n "${{ inputs.build_args }}" ]; then
              for arg in $(echo "${{ inputs.build_args }}" | tr ',' ' '); do
                BUILD_ARGS="$BUILD_ARGS --build-arg $arg"
              done
            fi

            # Base version (legacy apps)
            BASE_VERSION_ARG=""
            if [ -n "${{ matrix.base_version }}" ]; then
              BASE_VERSION_ARG="--base-version ${{ matrix.base_version }}"
            fi

            # Aliases from matrix (config.yaml) or inputs
            # Add arch suffix for non-amd64 to avoid overwriting
            ALIASES=""
            if [ -n "${{ matrix.aliases }}" ]; then
              for a in ${{ matrix.aliases }}; do
                ALIASES="$ALIASES --alias ${a}${{ matrix.arch_suffix }}"
              done
            fi
            if [ -n "${{ inputs.extra_tags }}" ]; then
              for tag in $(echo "${{ inputs.extra_tags }}" | tr ',' ' '); do
                ALIASES="$ALIASES --alias ${tag}${{ matrix.arch_suffix }}"
              done
            fi

            # Version flag: auto_version (base images) or tag-version (apps)
            VERSION_FLAG="--tag-version"
            if [ "${{ matrix.auto_version }}" = "true" ]; then
              VERSION_FLAG="--auto-version"
            fi

            # Build (no push yet)
            ./scripts/build.sh \
              --registry ${{ env.REGISTRY }} \
              --image ${{ env.REGISTRY }}/daemonless/${{ inputs.image_name }} \
              --containerfile ${{ matrix.containerfile }} \
              --arch ${{ matrix.arch }} \
              $BASE_VERSION_ARG \
              $BUILD_ARGS \
              --tag ${{ matrix.tag }}${{ matrix.arch_suffix }} \
              $VERSION_FLAG \
              --version-suffix "${{ matrix.version_suffix }}" \
              ${{ matrix.push_latest }} \
              $ALIASES \
              --skip-wip

            # Test with cit (blocking - must pass before push)
            echo "=== Running cit tests ==="
            fetch -qo - https://github.com/daemonless/cit/releases/download/v${{ env.CIT_VERSION }}/cit-${{ env.CIT_VERSION }}.tar.gz | tar xz
            ./cit-${{ env.CIT_VERSION }}/cit --setup

            # Install podman-compose if compose mode needed
            if [ -f ".daemonless/compose.yml" ] || [ -f ".daemonless/compose.yaml" ]; then
              pkg install -y ${{ env.COMPOSE_PACKAGES }}
            fi

            mkdir -p cit-results

            # Test mode: shell for base images, default for apps
            CIT_MODE=""
            if [ "${{ matrix.type }}" = "base" ]; then
              CIT_MODE="--mode shell"
            fi

            # Run cit and capture exit code (don't fail immediately)
            cit_exit=0
            ./cit-${{ env.CIT_VERSION }}/cit ${{ env.REGISTRY }}/daemonless/${{ inputs.image_name }}:build \
              --repo . \
              --tag ${{ matrix.tag }}${{ matrix.arch_suffix }} \
              $CIT_MODE \
              --json cit-results/${{ inputs.image_name }}-${{ matrix.tag }}${{ matrix.arch_suffix }}.json \
              --screenshot cit-results/${{ inputs.image_name }}-${{ matrix.tag }}${{ matrix.arch_suffix }}.png \
              --verbose || cit_exit=$?

            # Always copy any temp screenshots to results (for debugging failures)
            cp /tmp/cit-screenshot*.png cit-results/ 2>/dev/null || true

            # Save cit exit code to file (don't exit here - let copyback happen first)
            echo "$cit_exit" > cit-results/cit-exit-code

            # Only push if cit passed and not a PR
            if [ $cit_exit -ne 0 ]; then
              echo "cit failed with exit code $cit_exit - skipping push"
            elif [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "PR build - skipping push"
            else
              echo "=== Pushing to ghcr.io ==="
              echo "$GITHUB_TOKEN" | podman login ${{ env.REGISTRY }} -u $GITHUB_ACTOR --password-stdin
              ./scripts/build.sh \
                --registry ${{ env.REGISTRY }} \
                --image ${{ env.REGISTRY }}/daemonless/${{ inputs.image_name }} \
                --containerfile ${{ matrix.containerfile }} \
                --arch ${{ matrix.arch }} \
                $BASE_VERSION_ARG \
                $BUILD_ARGS \
                --tag ${{ matrix.tag }}${{ matrix.arch_suffix }} \
                $VERSION_FLAG \
                --version-suffix "${{ matrix.version_suffix }}" \
                ${{ matrix.push_latest }} \
                $ALIASES \
                --skip-wip \
                --push

              # Also push to Docker Hub if credentials are available
              if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
                echo "=== Pushing to Docker Hub ==="
                echo "$DOCKERHUB_TOKEN" | podman login docker.io -u $DOCKERHUB_USERNAME --password-stdin
                ./scripts/build.sh \
                  --registry docker.io \
                  --image docker.io/daemonless/${{ inputs.image_name }} \
                  --containerfile ${{ matrix.containerfile }} \
                  --arch ${{ matrix.arch }} \
                  $BASE_VERSION_ARG \
                  $BUILD_ARGS \
                  --tag ${{ matrix.tag }}${{ matrix.arch_suffix }} \
                  $VERSION_FLAG \
                  --version-suffix "${{ matrix.version_suffix }}" \
                  ${{ matrix.push_latest }} \
                  $ALIASES \
                  --skip-wip \
                  --push
              fi

              # Generate CycloneDX SBOM
              ./scripts/generate-sbom.sh \
                --image "${{ env.REGISTRY }}/daemonless/${{ inputs.image_name }}:build" \
                --image-name "${{ inputs.image_name }}" \
                --tag "${{ matrix.tag }}${{ matrix.arch_suffix }}" \
                --arch "${{ matrix.arch }}"
            fi

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cit-results-${{ matrix.tag }}${{ matrix.arch_suffix }}
          path: cit-results/
          retention-days: 30

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        if: success() && github.event_name != 'pull_request'
        with:
          name: sbom-${{ matrix.tag }}${{ matrix.arch_suffix }}
          path: sbom-results/
          retention-days: 90

      - name: Check cit result
        if: always()
        run: |
          if [ ! -f cit-results/cit-exit-code ]; then
            echo "ERROR: cit-exit-code file not found - copyback may have failed"
            exit 1
          fi
          exit_code=$(cat cit-results/cit-exit-code)
          if [ "$exit_code" != "0" ]; then
            echo "cit failed with exit code $exit_code"
            exit $exit_code
          fi

      - name: Update Docker Hub description
        if: success() && matrix.tag == 'latest' && matrix.arch == 'amd64' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: daemonless/daemonless/.github/actions/dockerhub-desc@main
        with:
          image_name: ${{ inputs.image_name }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Discord notification
        if: always()
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: daemonless/daemonless/.github/actions/discord-notify@main
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          image_name: ${{ inputs.image_name }}
          tag: ${{ matrix.tag }}${{ matrix.arch_suffix }}
          status: ${{ job.status }}
          commit_sha: ${{ github.sha }}
          commit_url: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: ${{ github.ref_name }}
          has_dockerhub: ${{ secrets.DOCKERHUB_USERNAME != '' }}

  # Create multi-arch manifests
  create-manifests:
    needs: [detect, build]
    if: success() && github.event_name != 'pull_request' && contains(needs.detect.outputs.architectures, 'aarch64')
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Create and push manifests
        env:
          MANIFEST_TAGS: ${{ needs.detect.outputs.manifest_tags }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          IMAGE_NAME="${{ inputs.image_name }}"

          # Login to Docker Hub if credentials available
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | podman login docker.io -u $DOCKERHUB_USERNAME --password-stdin
          fi

          for tag in $MANIFEST_TAGS; do
            echo "=== Creating manifest for $tag ==="

            # GHCR manifest
            podman manifest create ghcr.io/daemonless/${IMAGE_NAME}:${tag} \
              ghcr.io/daemonless/${IMAGE_NAME}:${tag} \
              ghcr.io/daemonless/${IMAGE_NAME}:${tag}-aarch64 || continue
            podman manifest push ghcr.io/daemonless/${IMAGE_NAME}:${tag} \
              docker://ghcr.io/daemonless/${IMAGE_NAME}:${tag}

            # Docker Hub manifest
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              podman manifest create docker.io/daemonless/${IMAGE_NAME}:${tag} \
                docker.io/daemonless/${IMAGE_NAME}:${tag} \
                docker.io/daemonless/${IMAGE_NAME}:${tag}-aarch64 || continue
              podman manifest push docker.io/daemonless/${IMAGE_NAME}:${tag} \
                docker://docker.io/daemonless/${IMAGE_NAME}:${tag}
            fi
          done

  # Compose-only test (no build, just test pre-built images)
  test-compose:
    needs: detect
    if: ${{ needs.detect.outputs.compose_only == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare VM data directory
        run: sudo mkdir -p /mnt/freebsd-vm && sudo chmod 777 /mnt/freebsd-vm

      - name: Test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1.3.5
        with:
          release: "15.0"
          usesh: true
          copyback: true
          data-dir: /mnt/freebsd-vm
          prepare: |
            set -e
            mkdir -p /etc/pkg
            echo 'FreeBSD: { url: "http://pkg.FreeBSD.org/${ABI}/latest" }' > /etc/pkg/FreeBSD.conf
            pkg update -f
            pkg install -y podman ${{ env.COMPOSE_PACKAGES }} jq

            # Install patched ocijail for .NET apps (mlock support)
            fetch -qo /tmp/ocijail.pkg "https://github.com/daemonless/freebsd-ports/releases/download/v0.4.0-patched/ocijail-0.4.0_2-${{ matrix.arch }}.pkg"
            pkg install -fy /tmp/ocijail.pkg

            rm -rf /var/db/containers /var/lib/containers 2>/dev/null || true
            kldload pf
            sysctl net.inet.ip.forwarding=1
            sysctl kern.ipc.shm_allow_removed=1
          run: |
            set -e

            # Download cit
            fetch -qo - https://github.com/daemonless/cit/releases/download/v${{ env.CIT_VERSION }}/cit-${{ env.CIT_VERSION }}.tar.gz | tar xz
            ./cit-${{ env.CIT_VERSION }}/cit --setup

            # Run cit in compose mode (no image arg - detected from config)
            mkdir -p cit-results
            ./cit-${{ env.CIT_VERSION }}/cit \
              --repo . \
              --json cit-results/${{ inputs.image_name }}.json \
              --screenshot cit-results/${{ inputs.image_name }}.png \
              --verbose

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cit-results
          path: cit-results/
          retention-days: 30

      - name: Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993
            STATUS="✅ Success"
          else
            COLOR=15158332
            STATUS="❌ Failed"
          fi

          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"

          curl -sS -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"${{ inputs.image_name }} compose test $STATUS\",\"url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"color\":$COLOR,\"fields\":[{\"name\":\"Commit\",\"value\":\"[$SHORT_SHA](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})\",\"inline\":true},{\"name\":\"Branch\",\"value\":\"${{ github.ref_name }}\",\"inline\":true}]}]}" \
            "$DISCORD_WEBHOOK"

  # Merge SBOMs and commit to repo
  commit-sbom:
    needs: build
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-*
          path: sbom-artifacts/

      - name: Merge SBOMs
        run: |
          jq -n \
            --arg image "${{ inputs.image_name }}" \
            --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{image: $image, generated: $generated, tags: {}}' > sbom.json

          for f in sbom-artifacts/sbom-*/*-sbom.json; do
            [ -f "$f" ] || continue
            tag=$(jq -r '.tag' "$f")
            [ -z "$tag" ] && continue
            echo "Processing: $tag"
            jq --arg tag "$tag" \
               --slurpfile data "$f" \
               '.tags[$tag] = ($data[0] | del(.image, .tag))' \
               sbom.json > tmp.json && mv tmp.json sbom.json
          done

          echo "Tags: $(jq -r '.tags | keys | join(", ")' sbom.json)"
          jq -r '.tags | to_entries[] | "\(.key): \(.value.summary.total) packages"' sbom.json

      - name: Commit SBOM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sbom.json
          if git diff --staged --quiet; then
            echo "No changes to sbom.json"
          else
            git commit -m "Update sbom.json [skip ci]"
            git push
          fi

  # Trigger status page update after successful builds
  notify-status:
    needs: [build, test-compose, commit-sbom, create-manifests]
    if: always() && !failure() && !cancelled() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger status update
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/daemonless/daemonless-io/dispatches \
            -d '{"event_type": "status-update", "client_payload": {"image": "${{ inputs.image_name }}"}}'
