name: Check for Package Updates

on:
  schedule:
    - cron: '50 */6 * * *'  # Every 6 hours, 10 min before deploy
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: daemonless

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check versions in FreeBSD VM
        uses: vmactions/freebsd-vm@v1.4.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release: "15.0"
          usesh: true
          copyback: true
          envs: 'GITHUB_TOKEN'
          prepare: |
            pkg upgrade -y
            pkg install -y python3 py311-pyyaml jq
            # Configure both quarterly and latest repos for version checking
            # Use https:// instead of pkg+http:// to avoid SRV lookup issues
            mkdir -p /usr/local/etc/pkg/repos
            echo 'FreeBSD: { enabled: no }' > /usr/local/etc/pkg/repos/FreeBSD.conf
            echo 'FreeBSD-quarterly: { url: "https://pkg.FreeBSD.org/${ABI}/quarterly", enabled: yes }' > /usr/local/etc/pkg/repos/quarterly.conf
            echo 'FreeBSD-latest: { url: "https://pkg.FreeBSD.org/${ABI}/latest", enabled: yes }' > /usr/local/etc/pkg/repos/latest.conf
            pkg update -f
          run: |
            python3 scripts/generate_versions.py > daemonless-versions.json
            cat daemonless-versions.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: daemonless-versions
          path: daemonless-versions.json

      - name: Commit changes
        id: commit_changes
        run: |
          git config user.name "daemonless-bot[bot]"
          git config user.email "3247603+daemonless-bot[bot]@users.noreply.github.com"

          if [[ -n $(git status -s daemonless-versions.json) ]]; then
            git add daemonless-versions.json
            git commit -m "Update daemonless-versions.json"
            git push
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "No changes to commit."
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Repository Dispatch
        if: steps.commit_changes.outputs.updated == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: daemonless/daemonless-io
          event-type: status-update
