name: Check for Package Updates

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check versions in FreeBSD VM
        uses: vmactions/freebsd-vm@v1.3.5
        with:
          release: "15.0"
          usesh: true
          copyback: true
          # Install python3 and dependencies
          prepare: |
            pkg install -y python3 git jq
          run: |
            set -e
            # Clone all services to sibling directories
            mkdir -p ../
            while read -r service; do
              if [ -n "$service" ]; then
                echo "Cloning $service..."
                # Clone shallowly to save time
                git clone --depth 1 "https://github.com/daemonless/$service" "../$service" || echo "Failed to clone $service"
              fi
            done < scripts/services.txt
            
            # Run python generator
            python3 scripts/generate_versions.py > daemonless-versions.json
            cat daemonless-versions.json

      - name: Upload artifact (optional debugging)
        uses: actions/upload-artifact@v4
        with:
          name: daemonless-versions
          path: daemonless-versions.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # We only want to commit if there are changes
          if [[ -n $(git status -s daemonless-versions.json) ]]; then
            git add daemonless-versions.json
            git commit -m "Update daemonless-versions.json"
            git push
          else
            echo "No changes to commit."
          fi

      # TODO: Trigger rebuilds logic will need to be adapted to the new JSON structure
      # For now, we are just generating the file as requested.
