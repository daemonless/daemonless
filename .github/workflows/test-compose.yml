name: Reusable Compose Test

on:
  workflow_call:
    inputs:
      stack_name:
        description: 'Stack name for results (e.g., immich)'
        required: true
        type: string

env:
  CIT_VERSION: "0.2.4"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare VM data directory
        run: sudo mkdir -p /mnt/freebsd-vm && sudo chmod 777 /mnt/freebsd-vm

      - name: Test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1.3.5
        with:
          release: "15.0"
          usesh: true
          copyback: true
          data-dir: /mnt/freebsd-vm
          prepare: |
            set -e
            mkdir -p /etc/pkg
            echo 'FreeBSD: { url: "http://pkg.FreeBSD.org/${ABI}/latest" }' > /etc/pkg/FreeBSD.conf
            pkg update -f
            pkg install -y podman py311-podman-compose jq

            rm -rf /var/db/containers /var/lib/containers 2>/dev/null || true
            kldload pf
            sysctl net.inet.ip.forwarding=1
            sysctl kern.ipc.shm_allow_removed=1
          run: |
            set -e

            # Download cit
            fetch -qo - https://github.com/daemonless/cit/releases/download/v${{ env.CIT_VERSION }}/cit-${{ env.CIT_VERSION }}.tar.gz | tar xz
            ./cit-${{ env.CIT_VERSION }}/cit --setup

            # Run cit in compose mode (image arg ignored, uses .daemonless/compose.yml)
            mkdir -p cit-results
            ./cit-${{ env.CIT_VERSION }}/cit compose \
              --repo . \
              --json cit-results/${{ inputs.stack_name }}.json \
              --screenshot cit-results/${{ inputs.stack_name }}.png \
              --verbose

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cit-results
          path: cit-results/
          retention-days: 30

      - name: Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993
            STATUS="✅ Success"
          else
            COLOR=15158332
            STATUS="❌ Failed"
          fi

          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"

          curl -sS -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"${{ inputs.stack_name }} compose test $STATUS\",\"url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"color\":$COLOR,\"fields\":[{\"name\":\"Commit\",\"value\":\"[$SHORT_SHA](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})\",\"inline\":true},{\"name\":\"Branch\",\"value\":\"${{ github.ref_name }}\",\"inline\":true}]}]}" \
            "$DISCORD_WEBHOOK"
